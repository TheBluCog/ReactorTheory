name: Reactor Theory CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Build application
        run: npm run build

  smoke-tests:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Start local Vercel runtime
        run: |
          ./node_modules/.bin/vercel dev --listen 127.0.0.1:4173 > vercel-dev.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/api/artymus >/dev/null; then
              echo "Vercel runtime ready"
              exit 0
            fi
            sleep 1
          done
          echo "Vercel runtime failed to start"
          cat vercel-dev.log
          exit 1

      - name: Local strict ARTYMUS API verification
        env:
          ARTYMUS_BASE_URL: http://127.0.0.1:4173
          ARTYMUS_STRICT_LOCAL: "true"
        run: node scripts/check-artymus-api.cjs

      - name: Upload Vercel dev logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-dev-logs
          path: vercel-dev.log

  playwright:
    runs-on: ubuntu-latest
    needs: smoke-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Execute Playwright suite
        run: npx playwright test || true

  production-verification:
    runs-on: ubuntu-latest
    needs: playwright
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Wait for deployment propagation
        run: sleep 45

      - name: Production ARTYMUS verification
        env:
          ARTYMUS_BASE_URL: https://reactor-theory.vercel.app
        run: node scripts/check-artymus-api.cjs
