name: Reactor Theory CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Build application
        run: npm run build

  smoke-tests:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 0.0.0.0 > preview.log 2>&1 &
          sleep 10

      - name: Local ARTYMUS smoke verification
        env:
          ARTYMUS_BASE_URL: http://127.0.0.1:4173
        run: node scripts/check-artymus-api.cjs

      - name: Upload preview logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-server-logs
          path: preview.log

  playwright:
    runs-on: ubuntu-latest
    needs: smoke-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Execute Playwright suite
        run: npx playwright test || true

  production-verification:
    runs-on: ubuntu-latest
    needs: playwright
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Wait for deployment propagation
        run: sleep 45

      - name: Production ARTYMUS verification
        env:
          ARTYMUS_BASE_URL: https://reactor-theory.vercel.app
        run: node scripts/check-artymus-api.cjs
