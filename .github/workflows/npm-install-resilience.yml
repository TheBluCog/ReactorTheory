name: NPM Install Resilience

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - 'yarn.lock'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - 'yarn.lock'
      - '.github/workflows/**'

jobs:
  npm-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect lockfile
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js with cache
        if: ${{ steps.lockfile.outputs.has_lockfile == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Node.js without cache
        if: ${{ steps.lockfile.outputs.has_lockfile != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure npm resilience
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies with retry
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            INSTALL_CMD="npm ci --prefer-online --no-audit --fund=false"
          else
            INSTALL_CMD="npm install --prefer-online --no-audit --fund=false"
          fi

          for attempt in 1 2 3; do
            echo "Running $INSTALL_CMD attempt $attempt..."
            if $INSTALL_CMD; then
              echo "Dependency install succeeded."
              exit 0
            fi
            echo "Dependency install failed on attempt $attempt."
            npm cache verify || true
            sleep $((attempt * 20))
          done

          echo "Dependency install failed after 3 attempts."
          exit 1
