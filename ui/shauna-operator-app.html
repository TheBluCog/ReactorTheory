<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shauna Operator App — ARTYMUS</title>
  <style>
    :root{--paper:#e8e2d6;--ink:#171613;--soft:#6f685d;--line:#bbb09d;--silver:#c8c4ba;--deep:#070706;--seal:#782018}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 20%,#f0eadf 0%,var(--paper) 38%,#cfc6b6 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui}.shell{padding:40px}.header{display:flex;justify-content:space-between;align-items:center}.title{font-family:Georgia,serif;font-size:48px}.session{color:var(--soft)}.grid{margin-top:40px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{padding:20px;border:1px solid rgba(0,0,0,.15);background:#f4efe6}.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;color:var(--soft)}.card strong{font-size:28px;font-family:Georgia,serif}.bars{margin-top:30px}.bar{display:flex;justify-content:space-between;margin:10px 0}.line{height:6px;background:#ddd;margin-top:4px}.fill{height:6px;background:#999}
  </style>
</head>
<body>
  <div class="shell">
    <div class="header"><div class="title">Shauna Operator Console</div><div class="session">Session: Active</div></div>
    <div class="grid">
      <div class="card"><h3>System Status</h3><strong>Live</strong></div>
      <div class="card"><h3>RT11 Score</h3><strong>91.4</strong></div>
      <div class="card"><h3>Active Path</h3><strong>Place</strong></div>
      <div class="card"><h3>Signals</h3><strong>7</strong></div>
    </div>
    <div class="bars">
      <div class="bar">Identity <span>92</span></div><div class="line"><div class="fill" style="width:92%"></div></div>
      <div class="bar">Evidence <span>87</span></div><div class="line"><div class="fill" style="width:87%"></div></div>
      <div class="bar">Demand <span>79</span></div><div class="line"><div class="fill" style="width:79%"></div></div>
      <div class="bar">Control <span>84</span></div><div class="line"><div class="fill" style="width:84%"></div></div>
      <div class="bar">Drift <span>28</span></div><div class="line"><div class="fill" style="width:28%"></div></div>
    </div>
  </div>
</body>
</html>
