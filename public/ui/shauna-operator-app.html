<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shauna Operator App — ARTYMUS</title>
  <style>
    :root{--paper:#e8e2d6;--ink:#171613;--soft:#6f685d}*{box-sizing:border-box}body{margin:0;background:#f0eadf;font-family:Georgia,serif;color:#171613}.wrap{padding:60px}.title{font-size:52px}.grid{margin-top:40px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{padding:24px;background:#fff;border:1px solid #ccc}.card h3{font-size:12px;color:#666;text-transform:uppercase;margin:0 0 8px}.card strong{font-size:28px}.bar{margin-top:20px}.line{height:6px;background:#ddd}.fill{height:6px;background:#888}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">Shauna Operator Console</div>
    <div class="grid">
      <div class="card"><h3>Status</h3><strong>Live</strong></div>
      <div class="card"><h3>Score</h3><strong>91.4</strong></div>
      <div class="card"><h3>Action</h3><strong>Place</strong></div>
      <div class="card"><h3>Signals</h3><strong>7</strong></div>
    </div>
  </div>
</body>
</html>
